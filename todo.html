<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 목록 - my-blog</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .todo-title {
    margin: 0 0 0.3rem;
    font-family: var(--font-serif);
    font-size: 2rem;
    line-height: 1.3;
  }

  .todo-remaining {
    margin: 0 0 1.5rem;
    color: var(--color-text-muted);
    font-family: var(--font-mono);
    font-size: 0.9rem;
  }

  .todo-form {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .todo-input {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 0.4rem 0.8rem;
    background: var(--color-bg-elevated);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font: inherit;
    font-size: 1rem;
  }

  .todo-input::placeholder {
    color: var(--color-text-muted);
  }

  .todo-add {
    min-height: 44px;
    padding: 0 1.2rem;
    background: var(--color-accent);
    color: var(--color-bg);
    border: 1px solid var(--color-accent);
    border-radius: 8px;
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .todo-add:hover {
    filter: brightness(1.1);
  }

  .todo-input:focus-visible,
  .todo-add:focus-visible,
  .todo-check:focus-visible,
  .todo-delete:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    border-top: 1px solid var(--color-border);
    padding: 0.25rem 0;
  }

  .todo-item:last-child {
    border-bottom: 1px solid var(--color-border);
  }

  .todo-label {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-height: 44px;
    cursor: pointer;
  }

  .todo-check {
    flex: none;
    width: 22px;
    height: 22px;
    margin: 0;
    accent-color: var(--color-accent);
    cursor: pointer;
  }

  .todo-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .todo-item.is-done .todo-text {
    text-decoration: line-through;
    color: var(--color-text-muted);
    opacity: 0.7;
  }

  .todo-delete {
    flex: none;
    width: 44px;
    height: 44px;
    background: none;
    color: var(--color-text-muted);
    border: 1px solid transparent;
    border-radius: 8px;
    font: inherit;
    font-size: 1.1rem;
    cursor: pointer;
  }

  .todo-delete:hover {
    color: var(--color-accent);
    border-color: var(--color-border);
  }

  .todo-empty {
    color: var(--color-text-muted);
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <p class="site-title"><a href="index.html">my-blog</a></p>
      <p class="site-tagline">마크다운으로 쓰는 개발 기록</p>
      <p class="site-header-links"><a href="index.html">← 블로그로</a></p>
    </div>
  </header>

  <main>
    <h1 class="todo-title">할 일 목록</h1>
    <p class="todo-remaining" id="remaining" aria-live="polite"></p>

    <form class="todo-form" id="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">할 일 입력</label>
      <input class="todo-input" id="todo-input" type="text" placeholder="할 일을 입력하세요">
      <button class="todo-add" type="submit">추가</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="todo-empty" id="todo-empty" hidden>할 일이 없습니다. 하나 추가해 보세요.</p>
  </main>

  <footer class="site-footer">
    <p>마크다운으로 쓰고, 프레임워크 없이 보여줍니다.</p>
  </footer>

  <script>
    (function () {
      var KEY = 'todo-items';
      var items = load();

      var form = document.getElementById('todo-form');
      var input = document.getElementById('todo-input');
      var list = document.getElementById('todo-list');
      var empty = document.getElementById('todo-empty');
      var remaining = document.getElementById('remaining');

      function load() {
        try {
          var data = JSON.parse(localStorage.getItem(KEY));
          if (!Array.isArray(data)) return [];
          return data.filter(function (it) {
            return it && typeof it.text === 'string';
          }).map(function (it, i) {
            return { id: it.id != null ? it.id : Date.now() + i, text: it.text, done: !!it.done };
          });
        } catch (e) {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(items));
        } catch (e) { /* 저장 실패는 무시 */ }
      }

      function render() {
        list.textContent = '';
        items.forEach(function (item) {
          var li = document.createElement('li');
          li.className = 'todo-item' + (item.done ? ' is-done' : '');

          var label = document.createElement('label');
          label.className = 'todo-label';

          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'todo-check';
          cb.checked = item.done;
          cb.addEventListener('change', function () {
            item.done = cb.checked;
            save();
            render();
          });

          var span = document.createElement('span');
          span.className = 'todo-text';
          span.textContent = item.text;

          label.appendChild(cb);
          label.appendChild(span);

          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'todo-delete';
          del.textContent = '×';
          del.setAttribute('aria-label', '삭제: ' + item.text);
          del.addEventListener('click', function () {
            items = items.filter(function (it) { return it !== item; });
            save();
            render();
            input.focus();
          });

          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });

        var left = items.filter(function (it) { return !it.done; }).length;
        remaining.textContent = '남은 할 일 ' + left + '개';
        empty.hidden = items.length > 0;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var text = input.value.trim();
        if (!text) return;
        items.push({ id: Date.now() + Math.random(), text: text, done: false });
        input.value = '';
        save();
        render();
        input.focus();
      });

      render();
    })();
  </script>
</body>
</html>
